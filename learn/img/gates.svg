<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<rect width="900" height="590" fill="#ffffff"/>
<text x="450.0" y="30.0" font-size="18" fill="#1a202c" text-anchor="middle" font-weight="700">Reading a gate: where does the interval sit relative to 0 and the threshold?</text>
<text x="40.0" y="70.0" font-size="13" fill="#4a5568" text-anchor="start" font-weight="700">SCHEMATIC (threshold T)</text>
<line x1="398.6" y1="80.0" x2="398.6" y2="230.0" stroke="#4a5568" stroke-width="1.2"/>
<text x="398.6" y="245.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">0</text>
<line x1="584.3" y1="80.0" x2="584.3" y2="230.0" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="584.3" y="245.0" font-size="12" fill="#6b46c1" text-anchor="middle" font-weight="400">T (smallest meaningful effect)</text>
<text x="40.0" y="109.0" font-size="14" fill="#2f855a" text-anchor="start" font-weight="700">Support</text>
<text x="40.0" y="125.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="400">whole interval above 0, estimate ≥ T</text>
<line x1="602.9" y1="105.0" x2="732.9" y2="105.0" stroke="#2f855a" stroke-width="4"/>
<circle cx="666.0" cy="105.0" r="6" fill="#fff" stroke="#2f855a" stroke-width="1.5"/>
<text x="40.0" y="154.0" font-size="14" fill="#b7791f" text-anchor="start" font-weight="700">Exclusion</text>
<text x="40.0" y="170.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="400">upper bound below T</text>
<line x1="406.0" y1="150.0" x2="532.3" y2="150.0" stroke="#b7791f" stroke-width="4"/>
<circle cx="465.4" cy="150.0" r="6" fill="#fff" stroke="#b7791f" stroke-width="1.5"/>
<text x="40.0" y="199.0" font-size="14" fill="#4a5568" text-anchor="start" font-weight="700">Unresolved</text>
<text x="40.0" y="215.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="400">neither rule passes (e.g. spans 0 to T)</text>
<line x1="305.7" y1="195.0" x2="658.6" y2="195.0" stroke="#4a5568" stroke-width="4"/>
<circle cx="472.9" cy="195.0" r="6" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
<text x="40.0" y="290.0" font-size="13" fill="#4a5568" text-anchor="start" font-weight="700">MEASURED (each row has its own units and threshold — do not compare rows)</text>
<text x="40.0" y="337.0" font-size="13.5" fill="#1a202c" text-anchor="start" font-weight="700">Held-out natural text</text>
<text x="40.0" y="353.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="400">interaction, nat/token</text>
<line x1="250.0" y1="335.0" x2="770.0" y2="335.0" stroke="#e2e8f0" stroke-width="1"/>
<line x1="445.0" y1="321.0" x2="445.0" y2="349.0" stroke="#4a5568" stroke-width="1.2"/>
<line x1="580.4" y1="321.0" x2="580.4" y2="349.0" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="580.4" y="317.0" font-size="11" fill="#6b46c1" text-anchor="middle" font-weight="400">T=0.005</text>
<line x1="252.3" y1="335.0" x2="601.7" y2="335.0" stroke="#4a5568" stroke-width="4"/>
<circle cx="431.3" cy="335.0" r="6" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
<text x="782.0" y="339.0" font-size="13" fill="#4a5568" text-anchor="start" font-weight="700">unresolved</text>
<text x="40.0" y="395.0" font-size="13.5" fill="#1a202c" text-anchor="start" font-weight="700">Memory gate, targets 1–16</text>
<text x="40.0" y="411.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="400">memory benefit, nat/token</text>
<line x1="250.0" y1="393.0" x2="770.0" y2="393.0" stroke="#e2e8f0" stroke-width="1"/>
<line x1="445.0" y1="379.0" x2="445.0" y2="407.0" stroke="#4a5568" stroke-width="1.2"/>
<line x1="453.1" y1="379.0" x2="453.1" y2="407.0" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="453.1" y="375.0" font-size="11" fill="#6b46c1" text-anchor="middle" font-weight="400">T=0.005</text>
<line x1="423.6" y1="393.0" x2="728.6" y2="393.0" stroke="#4a5568" stroke-width="4"/>
<circle cx="576.1" cy="393.0" r="6" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
<text x="782.0" y="397.0" font-size="13" fill="#4a5568" text-anchor="start" font-weight="700">unresolved</text>
<text x="40.0" y="453.0" font-size="13.5" fill="#1a202c" text-anchor="start" font-weight="700">Remote-state gate (post-Q R+S)</text>
<text x="40.0" y="469.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="400">margin, nat/answer</text>
<line x1="250.0" y1="451.0" x2="770.0" y2="451.0" stroke="#e2e8f0" stroke-width="1"/>
<line x1="445.0" y1="437.0" x2="445.0" y2="465.0" stroke="#4a5568" stroke-width="1.2"/>
<line x1="648.1" y1="437.0" x2="648.1" y2="465.0" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="648.1" y="433.0" font-size="11" fill="#6b46c1" text-anchor="middle" font-weight="400">T=0.5</text>
<line x1="467.5" y1="451.0" x2="625.2" y2="451.0" stroke="#b7791f" stroke-width="4"/>
<circle cx="546.3" cy="451.0" r="6" fill="#fff" stroke="#b7791f" stroke-width="1.5"/>
<text x="782.0" y="455.0" font-size="13" fill="#b7791f" text-anchor="start" font-weight="700">+0.5 excluded</text>
<text x="40.0" y="511.0" font-size="13.5" fill="#1a202c" text-anchor="start" font-weight="700">Before-question R+S</text>
<text x="40.0" y="527.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="400">margin, nat/answer</text>
<line x1="250.0" y1="509.0" x2="770.0" y2="509.0" stroke="#e2e8f0" stroke-width="1"/>
<line x1="445.0" y1="495.0" x2="445.0" y2="523.0" stroke="#4a5568" stroke-width="1.2"/>
<line x1="695.0" y1="495.0" x2="695.0" y2="523.0" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="695.0" y="491.0" font-size="11" fill="#6b46c1" text-anchor="middle" font-weight="400">T=0.1</text>
<line x1="436.0" y1="509.0" x2="485.1" y2="509.0" stroke="#b7791f" stroke-width="4"/>
<circle cx="460.6" cy="509.0" r="6" fill="#fff" stroke="#b7791f" stroke-width="1.5"/>
<text x="782.0" y="513.0" font-size="13" fill="#b7791f" text-anchor="start" font-weight="700">+0.1 excluded</text>
<text x="450.0" y="575.0" font-size="13" fill="#c53030" text-anchor="middle" font-weight="600">Exclusion ≠ “the effect is zero”. It says an effect as large as T does not fit this assay's data.</text>
</svg>
