<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="860" height="380" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Many scores, few independent units</text>

  <!-- 8 registries each with 2 prompts x 2 candidates x 9 tokens -->
  <g font-size="12">
    <g transform="translate(40,60)">
      <rect width="180" height="130" rx="10" fill="#f7fafc" stroke="#3b5b92" stroke-width="2"/>
      <text x="90" y="20" text-anchor="middle" font-weight="700" fill="#3b5b92">registry 08</text>
      <rect x="12" y="32" width="75" height="84" rx="6" fill="#fff" stroke="#a0aec0"/><text x="49" y="48" text-anchor="middle" fill="#4a5568">base</text>
      <rect x="93" y="32" width="75" height="84" rx="6" fill="#fff" stroke="#a0aec0"/><text x="130" y="48" text-anchor="middle" fill="#4a5568">swap</text>
      <g fill="#2f855a"><circle cx="24" cy="62" r="3"/><circle cx="33" cy="62" r="3"/><circle cx="42" cy="62" r="3"/><circle cx="51" cy="62" r="3"/><circle cx="60" cy="62" r="3"/><circle cx="69" cy="62" r="3"/><circle cx="78" cy="62" r="3"/><circle cx="24" cy="72" r="3"/><circle cx="33" cy="72" r="3"/></g>
      <g fill="#c53030"><circle cx="24" cy="90" r="3"/><circle cx="33" cy="90" r="3"/><circle cx="42" cy="90" r="3"/><circle cx="51" cy="90" r="3"/><circle cx="60" cy="90" r="3"/><circle cx="69" cy="90" r="3"/><circle cx="78" cy="90" r="3"/><circle cx="24" cy="100" r="3"/><circle cx="33" cy="100" r="3"/></g>
      <g fill="#2f855a"><circle cx="105" cy="62" r="3"/><circle cx="114" cy="62" r="3"/><circle cx="123" cy="62" r="3"/><circle cx="132" cy="62" r="3"/><circle cx="141" cy="62" r="3"/><circle cx="150" cy="62" r="3"/><circle cx="159" cy="62" r="3"/><circle cx="105" cy="72" r="3"/><circle cx="114" cy="72" r="3"/></g>
      <g fill="#c53030"><circle cx="105" cy="90" r="3"/><circle cx="114" cy="90" r="3"/><circle cx="123" cy="90" r="3"/><circle cx="132" cy="90" r="3"/><circle cx="141" cy="90" r="3"/><circle cx="150" cy="90" r="3"/><circle cx="159" cy="90" r="3"/><circle cx="105" cy="100" r="3"/><circle cx="114" cy="100" r="3"/></g>
    </g>
    <g transform="translate(240,60)"><rect width="100" height="130" rx="10" fill="#f7fafc" stroke="#3b5b92" stroke-width="2"/><text x="50" y="20" text-anchor="middle" font-weight="700" fill="#3b5b92">09</text><text x="50" y="72" text-anchor="middle" fill="#4a5568">36 token</text><text x="50" y="88" text-anchor="middle" fill="#4a5568">scores</text></g>
    <g transform="translate(355,60)"><rect width="100" height="130" rx="10" fill="#f7fafc" stroke="#3b5b92" stroke-width="2"/><text x="50" y="20" text-anchor="middle" font-weight="700" fill="#3b5b92">10</text><text x="50" y="72" text-anchor="middle" fill="#4a5568">36 token</text><text x="50" y="88" text-anchor="middle" fill="#4a5568">scores</text></g>
    <g transform="translate(470,60)"><rect width="100" height="130" rx="10" fill="#f7fafc" stroke="#3b5b92" stroke-width="2"/><text x="50" y="20" text-anchor="middle" font-weight="700" fill="#3b5b92">11</text><text x="50" y="72" text-anchor="middle" fill="#4a5568">36 token</text><text x="50" y="88" text-anchor="middle" fill="#4a5568">scores</text></g>
    <text x="620" y="130" text-anchor="middle" font-size="22" fill="#4a5568">…</text>
    <g transform="translate(670,60)"><rect width="150" height="130" rx="10" fill="#f7fafc" stroke="#3b5b92" stroke-width="2"/><text x="75" y="20" text-anchor="middle" font-weight="700" fill="#3b5b92">15</text><text x="75" y="72" text-anchor="middle" fill="#4a5568">36 token</text><text x="75" y="88" text-anchor="middle" fill="#4a5568">scores</text></g>
  </g>
  <g font-size="12"><circle cx="48" cy="210" r="4" fill="#2f855a"/><text x="58" y="214" fill="#1a202c">gold-answer token scores (9)</text>
  <circle cx="258" cy="210" r="4" fill="#c53030"/><text x="268" y="214" fill="#1a202c">wrong-answer token scores (9)</text></g>

  <g font-size="13" fill="#1a202c">
    <text x="40" y="250">8 registries × 2 prompts × 2 candidates × 9 tokens = <tspan font-weight="700">288 token scores</tspan> per condition …</text>
    <text x="40" y="274">… but everything inside a registry shares the same names, codes and filler. They rise and fall together.</text>
    <text x="40" y="298">So: margin per prompt → average base &amp; swap → <tspan font-weight="700">one number per registry</tspan> → <tspan font-weight="700">n = 8</tspan> for the interval.</text>
    <text x="40" y="330" fill="#c53030" font-weight="600">Bootstrapping 20,000 times re-uses the same 8 registries. It stabilises the arithmetic; it does not add data.</text>
    <text x="40" y="354" fill="#4a5568">Same logic in the natural-text studies: tokens → spans → books. Four or six books = four or six units.</text>
  </g>
</svg>
