<text x="70.0" y="109.0" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="400">+3.0</text>
<text x="70.0" y="335.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">mat</text>
<rect x="102.0" y="160.0" width="40.0" height="90.0" rx="0" fill="#e6edf8" stroke="#3b5b92"/>
<text x="122.0" y="154.0" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="400">+2.0</text>
<text x="122.0" y="335.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">floor</text>
<rect x="154.0" y="205.0" width="40.0" height="45.0" rx="0" fill="#e6edf8" stroke="#3b5b92"/>
<text x="174.0" y="199.0" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="400">+1.0</text>
<text x="174.0" y="335.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">sofa</text>
<rect x="206.0" y="250.0" width="40.0" height="45.0" rx="0" fill="#e6edf8" stroke="#3b5b92"/>
<text x="226.0" y="311.0" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="400">-1.0</text>
<text x="226.0" y="335.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">moon</text>
<line x1="40.0" y1="250.0" x2="262.0" y2="250.0" stroke="#4a5568" stroke-width="1.0"/>
<text x="310.0" y="190.0" font-size="14" fill="#4a5568" text-anchor="middle" font-weight="700">softmax</text>
<text x="310.0" y="208.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">p = eˡ / Σ eˡ</text>
<line x1="280.0" y1="220.0" x2="340.0" y2="220.0" stroke="#4a5568" stroke-width="2"/>
<path d="M340,215 L350,220 L340,225 z" fill="#4a5568"/>
<text x="485.0" y="64.0" font-size="14" fill="#2f855a" text-anchor="middle" font-weight="700">2. probabilities (sum to 1)</text>
<rect x="380.0" y="105.4" width="40.0" height="144.6" rx="0" fill="#68d391" stroke="#2f855a"/>
<text x="400.0" y="99.4" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="400">0.657</text>
<text x="400.0" y="335.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">mat</text>
<rect x="432.0" y="196.8" width="40.0" height="53.2" rx="0" fill="#c6f6d5" stroke="#2f855a"/>
<text x="452.0" y="190.8" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="400">0.242</text>
<text x="452.0" y="335.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">floor</text>
<rect x="484.0" y="230.4" width="40.0" height="19.6" rx="0" fill="#c6f6d5" stroke="#2f855a"/>
<text x="504.0" y="224.4" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="400">0.089</text>
<text x="504.0" y="335.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">sofa</text>
<rect x="536.0" y="247.4" width="40.0" height="2.6" rx="0" fill="#c6f6d5" stroke="#2f855a"/>
<text x="556.0" y="241.4" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="400">0.012</text>
<text x="556.0" y="335.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">moon</text>
<line x1="370.0" y1="250.0" x2="592.0" y2="250.0" stroke="#4a5568" stroke-width="1.0"/>
<text x="730.0" y="64.0" font-size="14" fill="#c53030" text-anchor="middle" font-weight="700">3. loss for the TRUE token</text>
<rect x="630.0" y="90.0" width="205.0" height="170.0" rx="10" fill="#fff5f5" stroke="#c53030"/>
<text x="732.0" y="120.0" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="400">true next token: "mat"</text>
<text x="732.0" y="148.0" font-size="15" fill="#1a202c" text-anchor="middle" font-weight="700">q = 0.657</text>
<text x="732.0" y="178.0" font-size="15" fill="#c53030" text-anchor="middle" font-weight="700">NLL = −ln q = 0.420 nat</text>
<text x="732.0" y="208.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">if the truth were "moon":</text>
<text x="732.0" y="228.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">NLL = −ln 0.012 = 4.42 nat</text>
<text x="732.0" y="250.0" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="400">lower is better</text>
<text x="430.0" y="360.0" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="600">Perplexity = e^(mean NLL). It re-expresses the same average; it is not extra evidence.</text>
</svg>
