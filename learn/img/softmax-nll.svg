<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<rect width="860" height="380" fill="#ffffff"/>
<text x="430.0" y="30.0" font-size="18" fill="#1a202c" text-anchor="middle" font-weight="700">Toy: next token after "The cat sat on the"</text>
<text x="150.0" y="64.0" font-size="14" fill="#3b5b92" text-anchor="middle" font-weight="700">1. logits (any real number)</text>
