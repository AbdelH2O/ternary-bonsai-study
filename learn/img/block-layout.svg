    <text x="75" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#7b341e">Gated DeltaNet</text>
    <text x="75" y="55" text-anchor="middle" font-size="12" fill="#7b341e">+ MLP · keeps R, S</text>
    <rect x="170" y="12" width="150" height="56" rx="8" fill="#fde6d8" stroke="#c05621" stroke-width="2"/>
    <text x="245" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#7b341e">Gated DeltaNet</text>
    <text x="245" y="55" text-anchor="middle" font-size="12" fill="#7b341e">+ MLP · keeps R, S</text>
