<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="820" height="300" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">64 blocks = 16 repeats of [ recurrent, recurrent, recurrent, full attention ]</text>
