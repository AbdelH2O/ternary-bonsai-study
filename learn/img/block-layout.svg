    <text x="415" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#7b341e">Gated DeltaNet</text>
    <text x="415" y="55" text-anchor="middle" font-size="12" fill="#7b341e">+ MLP · keeps R, S</text>
    <rect x="510" y="12" width="150" height="56" rx="8" fill="#dcf1f0" stroke="#2c7a7b" stroke-width="2"/>
    <text x="585" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#234e52">Full attention</text>
    <text x="585" y="55" text-anchor="middle" font-size="12" fill="#234e52">+ MLP · keeps KV</text>
    <text x="690" y="45" font-size="22" fill="#4a5568">→ next</text>
  </g>
  <!-- strip of 64 -->
