<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">One Gated DeltaNet step (conceptual sketch, per head)</text>

  <!-- token input -->
  <rect x="20" y="170" width="120" height="50" rx="8" fill="#edf2f7" stroke="#4a5568"/>
  <text x="80" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">token vector</text>
  <text x="80" y="209" text-anchor="middle" font-size="12" fill="#4a5568">at step t</text>

  <!-- alpha path -->
  <line x1="140" y1="185" x2="200" y2="105" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="200" y="75" width="140" height="50" rx="8" fill="#e6edf8" stroke="#3b5b92" stroke-width="2"/>
  <text x="270" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#3b5b92">ssm_alpha (BF16)</text>
  <text x="270" y="114" text-anchor="middle" font-size="12" fill="#3b5b92">projection → alpha</text>
  <line x1="340" y1="100" x2="360" y2="100" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="360" y="70" width="250" height="60" rx="8" fill="#fff" stroke="#4a5568"/>
  <text x="485" y="93" text-anchor="middle" font-size="12.5" fill="#1a202c">g = softplus(alpha + dt_bias) × ssm_a</text>
  <text x="485" y="113" text-anchor="middle" font-size="12" fill="#4a5568">ssm_a &lt; 0, so g &lt; 0</text>
  <line x1="610" y1="100" x2="625" y2="100" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="625" y="75" width="220" height="50" rx="8" fill="#fde6d8" stroke="#c05621"/>
  <text x="735" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#7b341e">decay factor e^g</text>
  <text x="735" y="114" text-anchor="middle" font-size="12" fill="#7b341e">between 0 and 1: how much to KEEP</text>

  <!-- beta path -->
  <line x1="140" y1="205" x2="200" y2="285" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="200" y="265" width="140" height="50" rx="8" fill="#e6edf8" stroke="#3b5b92" stroke-width="2"/>
  <text x="270" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#3b5b92">ssm_beta (BF16)</text>
  <text x="270" y="304" text-anchor="middle" font-size="12" fill="#3b5b92">projection → b</text>
  <line x1="340" y1="290" x2="360" y2="290" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="360" y="265" width="250" height="50" rx="8" fill="#fff" stroke="#4a5568"/>
  <text x="485" y="295" text-anchor="middle" font-size="13" fill="#1a202c">β = sigmoid(b)   (0 … 1)</text>
  <line x1="610" y1="290" x2="625" y2="290" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="625" y="265" width="220" height="50" rx="8" fill="#fde6d8" stroke="#c05621"/>
  <text x="735" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#7b341e">write strength β</text>
  <text x="735" y="304" text-anchor="middle" font-size="12" fill="#7b341e">how hard to WRITE the new item</text>

  <!-- state update -->
  <rect x="300" y="160" width="400" height="70" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="500" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#7b341e">S(t) = keep × S(t−1)  +  write × (new association)</text>
  <text x="500" y="210" text-anchor="middle" font-size="12" fill="#7b341e">the "delta" part: write the correction v − S·k, not the raw value</text>
  <line x1="730" y1="125" x2="690" y2="160" stroke="#c05621" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="730" y1="265" x2="690" y2="230" stroke="#c05621" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="430" y="350" text-anchor="middle" font-size="13" fill="#2d3748">Blue boxes are <tspan font-weight="700">weights</tspan> (the perturbation target). S is <tspan font-weight="700">runtime state</tspan> (F32).</text>
  <text x="430" y="372" text-anchor="middle" font-size="12" fill="#4a5568">Exact graph: PrismML-Eng/llama.cpp @842b188 src/models/qwen35.cpp. This sketch omits normalisation, heads and the conv step.</text>
</svg>
