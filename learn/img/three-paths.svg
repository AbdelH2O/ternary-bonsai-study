<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c7a7b"/></marker>
    <marker id="a-org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker>
    <marker id="a-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
  </defs>
  <rect width="860" height="380" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">An old fact can reach the answer by more than one path</text>

  <!-- prompt tape -->
  <rect x="30" y="150" width="130" height="44" rx="6" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="95" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#744210">old fact</text>
  <text x="95" y="186" text-anchor="middle" font-size="12" fill="#744210">"Item K → code 7Q3"</text>
  <rect x="160" y="150" width="440" height="44" fill="#edf2f7" stroke="#a0aec0"/>
  <text x="380" y="177" text-anchor="middle" font-size="13" fill="#4a5568">… ~12,000 tokens of filler and distractor records …</text>
  <rect x="600" y="150" width="120" height="44" rx="6" fill="#e9d8fd" stroke="#6b46c1" stroke-width="2"/>
  <text x="660" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#44337a">Question: K?</text>
  <rect x="740" y="150" width="95" height="44" rx="6" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="787" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#22543d">answer</text>

  <!-- KV path: arc over top -->
  <path d="M95,148 C 200,100 560,100 655,146" fill="none" stroke="#2c7a7b" stroke-width="3" marker-end="url(#a-teal)"/>
  <text x="375" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#234e52">KV path (full attention)</text>
  <text x="375" y="84" text-anchor="middle" font-size="12" fill="#234e52">the fact's key/value stays in the cache; the question can look it up directly</text>

  <!-- S path: carried along below -->
  <path d="M95,196 C 110,250 150,262 200,262 L 560,262 C 610,262 640,250 655,198" fill="none" stroke="#c05621" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#a-org)"/>
  <text x="380" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#7b341e">S path (recurrent state)</text>
  <text x="380" y="282" text-anchor="middle" font-size="12" fill="#7b341e">a compressed summary carried token by token — may decay or be overwritten by filler</text>

  <!-- R path: short span only -->
  <path d="M700,198 C 715,228 750,228 772,198" fill="none" stroke="#b7791f" stroke-width="3" marker-end="url(#a-amb)"/>
  <text x="760" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#744210">R (conv buffer)</text>
  <text x="760" y="340" text-anchor="middle" font-size="12" fill="#744210">spans only the last few tokens</text>
  <line x1="760" y1="306" x2="738" y2="226" stroke="#b7791f" stroke-width="1" stroke-dasharray="2 3"/>

  <text x="430" y="368" text-anchor="middle" font-size="13" fill="#c53030" font-weight="600">A changed S at the answer does not tell you WHEN the information entered S.</text>
</svg>
